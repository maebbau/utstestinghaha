name: Collaborative Workflow

on:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  update_html_and_readme:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest

    steps:
      # Step 1: Checkout the repository
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # Step 2: Detect the actor and update index.html
      - name: Update index.html
        env:
          ACTOR: ${{ github.actor }}
        run: |
          if [ "$ACTOR" = "maebbau" ]; then
            ROLE="Team Leader"
          else
            ROLE="Team Member"
          fi

          STAMP=$(date -u '+%Y-%m-%d %H:%M:%S UTC')
          sed -i "/<\/body>/i\    <p>Updated by ${ROLE} (${ACTOR}) on ${STAMP}</p>" index.html

      # Step 3: Append a log entry to README.md
      - name: Update README
        env:
          ACTOR: ${{ github.actor }}
        run: |
          STAMP=$(date -u '+%Y-%m-%d %H:%M:%S UTC')
          COMMIT=$(git rev-parse --short HEAD)
          echo "- Updated by ${ACTOR} on ${STAMP} [Commit: ${COMMIT}]" >> README.md

      # Step 4: Commit the generated changes back to main
      - name: Commit and Push Changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html README.md
          git diff --cached --quiet && exit 0
          git commit -m "Workflow: update HTML and README for ${{ github.actor }}"
          git push origin HEAD:main
